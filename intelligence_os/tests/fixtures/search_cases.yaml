# ---------------------------------------------------------------------------
# G1 — word matching. Stemming and phrase handling: Phase 2.
# ---------------------------------------------------------------------------
- id: stem_cigarettes
  question: "anyone with cigarettes?"
  gap: G1
  fixed_by: 2
  baseline: pass          # Phase 2: porter stems "cigarettes" -> "cigarett"
  plan: {start: null, end: null, zone: null, predicate_contains: "cigarettes"}
  expect_entities: [dave]

- id: stopword_on_the_phone
  question: "was anyone on the phone?"
  gap: G1
  fixed_by: 2
  baseline: pass          # Phase 2: "the" is dropped, not required
  plan: {start: null, end: null, zone: null, predicate_contains: "on the phone"}
  expect_entities: [priya]

- id: term_order_flickering_light
  question: "was a light flickering anywhere?"
  gap: G1
  fixed_by: 2
