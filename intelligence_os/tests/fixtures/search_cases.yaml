# Search quality cases (search plan Phase 0).
#
# Each case is a question, a STUBBED query plan, and what the memory must return.
# The plan is stubbed on purpose: this measures RETRIEVAL, not how well the LLM
# parses English. Planner accuracy is a separate, key-requiring suite.
#
# Fields
#   id          stable identifier; the scorecard is keyed on it
#   question    the English a user would actually type
#   gap         which audited gap it exhibits (docs/search-architecture-plan.md §1.2)
#   fixed_by    the phase expected to make it pass (0 = already passing)
#   plan        the structured query handed to ask.execute()
#   baseline    pass | fail — what today's code does. CI asserts reality matches
#               this, so a phase that fixes a case turns the suite red until the
#               baseline is flipped. Deliberate: nothing improves silently either.
#
# Expectations (all optional; a case passes only if every one present is met)
#   expect_entities      corpus keys that MUST appear in the results
#   expect_text          substring that must appear in some returned state
#   expect_keyframe      substring of a keyframe path that must be attached
#   expect_empty         true -> a genuine true-negative; must return nothing
#   expect_min_count     minimum aggregate count (recurrence questions)
#   expect_max_entities  upper bound (limit / negation cases)
#   forbid_entities      corpus keys that must NOT appear

# ---------------------------------------------------------------------------
# Regression guards — these work today and must never stop working.
# ---------------------------------------------------------------------------
