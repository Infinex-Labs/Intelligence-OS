- id: stem_parcels
  question: "anyone carrying parcels?"
  gap: G1
  fixed_by: 2
  baseline: pass          # Phase 2: "parcels" and "parcel" share a stem
  plan: {start: null, end: null, zone: null, predicate_contains: "parcels"}
  expect_entities: [courier]

