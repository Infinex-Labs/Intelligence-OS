# ---------------------------------------------------------------------------
# G3 / G8 — habits and co-presence. Built, stored, unreachable. Phase 5.
# ---------------------------------------------------------------------------
- id: recurrence_van_how_often
  question: "how often does that van come by?"
  gap: G3
  fixed_by: 5
  baseline: fail          # ask.py never queries the relations table
  plan: {intent: how_often, start: null, end: null, entity_label: "white van"}
  expect_entities: [van]
  expect_min_count: 6
  # A raw observation count is not a recurrence answer — the result has to carry
  # the mined habit, or "how often" is just "how many rows".
  expect_result_key: recurrence

- id: recurrence_van_weekday
  question: "does the van come mostly on Tuesdays?"
  gap: G8
  fixed_by: 5
  baseline: fail          # habits bucket hour-of-day only, no weekday dimension
  plan: {intent: how_often, start: null, end: null, entity_label: "white van",
         group_by: weekday}
  expect_entities: [van]
  expect_min_count: 6
  expect_result_key: recurrence

