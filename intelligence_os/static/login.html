<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Intelligence OS — Secure Auth</title>
    <link rel="icon" type="image/png" href="/static/logo.png">
    <link rel="apple-touch-icon" href="/static/logo.png">
    <link rel="stylesheet" href="/static/style.css">
    <style>
        .login-wrapper {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .login-card {
            width: 100%;
            max-width: 440px;
            padding: 40px;
            display: flex;
            flex-direction: column;
            gap: 28px;
        }

        .login-header {
            text-align: center;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .login-header .mark {
            width: 64px;
            height: 64px;
            border-radius: 16px;
            align-self: center;
            margin-bottom: 4px;
            display: block;
        }

        .login-header h1 {
            font-size: 24px;
            font-weight: 600;
            letter-spacing: -0.5px;
            color: var(--text-primary);
        }

        .login-header p {
            color: var(--text-secondary);
            font-size: 14px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-bottom: 20px;
        }

        .form-group label {
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--text-secondary);
            font-weight: 600;
        }

        .form-group input {
            background: rgba(15, 17, 21, 0.5);
            border: 1px solid var(--glass-border);
            color: var(--text-primary);
            padding: 12px 16px;
            border-radius: 8px;
            font-size: 15px;
            transition: all 0.3s ease;
            outline: none;
        }

        .form-group input:focus {
            border-color: var(--accent-color);
            box-shadow: 0 0 8px var(--accent-glow);
            background: rgba(15, 17, 21, 0.8);
        }

        .login-btn {
            background: var(--accent-color);
            color: white;
            border: none;
            padding: 14px;
            border-radius: 8px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
            box-shadow: 0 4px 12px var(--accent-glow);
        }

        .login-btn:hover {
            opacity: 0.9;
            transform: translateY(-1px);
            box-shadow: 0 6px 16px var(--accent-glow);
        }

        .login-btn:active {
            transform: translateY(0);
        }

        .error-message {
            background: rgba(239, 68, 68, 0.1);
            border: 1px solid rgba(239, 68, 68, 0.2);
            color: #f87171;
            padding: 12px 16px;
            border-radius: 8px;
            font-size: 13px;
            display: none;
            line-height: 1.4;
        }

        .badge {
            background: rgba(59, 130, 246, 0.15);
            color: #60a5fa;
            padding: 4px 10px;
            border-radius: 12px;
            font-size: 11px;
            font-weight: 600;
            align-self: center;
            border: 1px solid rgba(59, 130, 246, 0.2);
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
    </style>
</head>
<body>
    <div class="login-wrapper">
        <div class="login-card glass">
            <div class="login-header">
                <img class="mark" src="/static/logo.png" alt="Intelligence OS" width="64" height="64">
                <span id="badge" class="badge" style="display: none;">First Run</span>
                <h1 id="title">Sign In</h1>
                <p id="subtitle">Access your perceptual memory system</p>
            </div>

            <div id="error" class="error-message"></div>

            <form id="authForm">
                <div class="form-group">
                    <label for="username">Username</label>
                    <input type="text" id="username" autocomplete="username" required placeholder="e.g. admin">
                </div>
                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" autocomplete="current-password" required placeholder="••••••••">
                </div>
                <button type="submit" class="login-btn" id="submitBtn">
                    <span>Sign In</span>
                </button>
            </form>
        </div>
    </div>

    <script>
        const badgeEl = document.getElementById('badge');
        const titleEl = document.getElementById('title');
        const subtitleEl = document.getElementById('subtitle');
        const submitBtnEl = document.getElementById('submitBtn');
        const authForm = document.getElementById('authForm');
        const errorEl = document.getElementById('error');
        const passwordInput = document.getElementById('password');

        let isFirstRun = false;

        async function checkStatus() {
            try {
                const res = await fetch('/api/auth/status');
                const data = await res.json();
                isFirstRun = data.first_run;

                if (isFirstRun) {
                    badgeEl.style.display = 'inline-block';
                    badgeEl.textContent = 'Initial Setup';
                    titleEl.textContent = 'Create Admin Account';
                    subtitleEl.textContent = 'Secure this installation with a primary administrator account';
                    submitBtnEl.querySelector('span').textContent = 'Create & Sign In';
                    passwordInput.placeholder = 'At least 8 characters';
                    passwordInput.autocomplete = 'new-password';
                }
            } catch (err) {
                console.error("Failed to fetch auth status", err);
            }
        }

        authForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            errorEl.style.display = 'none';
            submitBtnEl.disabled = true;
            submitBtnEl.style.opacity = '0.7';

            const username = document.getElementById('username').value;
            const password = passwordInput.value;
            const endpoint = isFirstRun ? '/api/auth/register' : '/api/auth/login';

            try {
                const res = await fetch(endpoint, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });
                const data = await res.json();

                if (!res.ok) {
                    throw new Error(data.error || 'Authentication failed');
                }

                // Successful login/register -> redirect to dashboard
                window.location.href = '/';
            } catch (err) {
                errorEl.textContent = err.message;
                errorEl.style.display = 'block';
                submitBtnEl.disabled = false;
                submitBtnEl.style.opacity = '1';
            }
        });

        checkStatus();
    </script>
</body>
</html>
